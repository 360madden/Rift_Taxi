[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-taxi"
version = "0.1.0"
description = "Standalone destination-first navigation for RIFT MMORPG"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rift-taxi = "rift_taxi.cli:main"
rift-taxi-local = "rift_taxi.local_taxi:main"
rift-taxi-local-viewer = "rift_taxi.local_taxi_gui:main"
rift-taxi-world = "rift_taxi.world_route_graph:main"
rift-taxi-world-viewer = "rift_taxi.world_route_viewer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rift_taxi*"]
