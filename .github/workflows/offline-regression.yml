# Hosted checks require no RIFT installation, credentials or local PC.
name: Offline regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Cancel obsolete runs of the same PR/ref rather than queue stale commits.
concurrency:
  group: offline-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Runtime is stdlib-only; running from the root avoids unnecessary
      # package downloads and tests the exact checked-out source.
      - name: Run full offline regression suite
        if: matrix.os != 'windows-latest'
        run: python -B -m unittest discover -s tests -v
      # Windows exercises the real recovery CLI, which itself runs the full
      # unskipped suite. No extra duplicate regression execution is needed.
      - name: Rehearse patch recovery with synthetic manifests
        if: matrix.os == 'windows-latest'
        run: python -B scripts/ci_patch_recovery_rehearsal.py --minimum-tests 556
      - name: Upload synthetic recovery rehearsal
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-rehearsal-windows
          path: |
            artifacts/patch-check-hosted-synthetic-rehearsal/
            artifacts/hosted-synthetic-rehearsal-summary.json
          if-no-files-found: warn
          retention-days: 90
      # Preserve a complete synthetic comparison, including failed cases.
      # Each runner uses a separate artifact; floating-point differences
      # can change bytes without changing the discrete research outcomes.
      - name: Archive V4 synthetic comparison
        run: python -B -m rift_taxi.simulation_holdout_v4_comparison > v4-comparison.json
      - name: Upload V4 comparison
        uses: actions/upload-artifact@v4
        with:
          name: v4-comparison-${{ matrix.os }}
          path: v4-comparison.json
          if-no-files-found: error
          retention-days: 90
      # The terminal diagnostic is a separate observed-case receipt. Keep
      # its archive distinct from the frozen V4 comparison artifact.
      - name: Archive observed V4 terminal queue diagnostic
        run: python -B -m rift_taxi.simulation_v4_terminal_observation > v4-terminal-observation.json
      - name: Upload V4 terminal observations
        uses: actions/upload-artifact@v4
        with:
          name: v4-terminal-observation-${{ matrix.os }}
          path: v4-terminal-observation.json
          if-no-files-found: error
          retention-days: 90
  minimum-python:
    name: Python 3.11 / wheel and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Check the declared minimum on the source tree before verifying an
      # installed wheel. No physical game client or sibling checkout is used.
      # The full suite includes the previously repeated focused tests.
      - name: Run full minimum-version regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
      # Isolated mode excludes the checkout from sys.path, so successful
      # imports demonstrate package discovery rather than source-tree imports.
      - name: Check installed research modules and CLI help
        run: |
          python -I -c "import importlib, pathlib, sysconfig; root=pathlib.Path(sysconfig.get_paths()['purelib']).resolve(); names=('delay_factorial_audit','delay_factorial_diagnostics','delay_factorial_stratification','simulation_holdout_v4_design','simulation_holdout_v4_comparison','simulation_v4_terminal_observation'); modules=[importlib.import_module('rift_taxi.'+n) for n in names]; assert all(pathlib.Path(m.__file__).resolve().is_relative_to(root) for m in modules); print('INSTALLED_RESEARCH_MODULES', len(modules), root)"
          python -I -m rift_taxi.delay_factorial_audit --help
          python -I -m rift_taxi.delay_factorial_diagnostics --help
          python -I -m rift_taxi.delay_factorial_stratification --help
      # Exercise the installed user-facing journey from outside the checkout.
      # The trace is an explicit input; neither modules nor outputs rely on
      # a working tree import. A failed model journey is valid report data.
      - name: Run installed offline journey demonstration
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m rift_taxi.synthetic_journey_demo --help
          python -I -m rift_taxi.synthetic_journey_audit --help
          python -I -m rift_taxi.synthetic_journey_demo "$GITHUB_WORKSPACE/samples/synthetic_continuous.json" --delay-steps 2 --out installed-journey.json
          python -I -c "import json; from pathlib import Path; r=json.loads(Path('installed-journey.json').read_text(encoding='utf-8')); assert r['schema']=='taxi.synthetic-journey-demo/1' and r['routeId']=='three-bend-synthetic-course' and r['classification']=='SYNTHETIC_ONLY' and not r['gameInputSent'] and not r['physicalQualification']; print('INSTALLED_JOURNEY', r['summary'])"
          # Verify the saved report from the installed wheel in isolated mode.
          python -I -m rift_taxi.synthetic_journey_audit "$GITHUB_WORKSPACE/samples/synthetic_continuous.json" installed-journey.json --terminal-budget 5 --out installed-journey-audit.json
      # Exercise every new opt-in approach from the installed package, not
      # just imports or the source checkout. Report status may be failed.
      - name: Run installed experimental journey modes
        working-directory: ${{ runner.temp }}
        run: |
          for mode in predict-near-goal predict-near-stall zero-delay-rejoin; do
            delay=2
            if [ "$mode" = zero-delay-rejoin ]; then delay=0; fi
            python -I -m rift_taxi.synthetic_journey_demo "$GITHUB_WORKSPACE/samples/synthetic_continuous.json" --delay-steps "$delay" --approach-mode "$mode" --out "installed-journey-$mode.json"
            python -I -m rift_taxi.synthetic_journey_audit "$GITHUB_WORKSPACE/samples/synthetic_continuous.json" "installed-journey-$mode.json" --terminal-budget 5 --out "installed-journey-$mode-audit.json"
          done
          python -I -c "import json; from pathlib import Path; modes=('predict-near-goal','predict-near-stall','zero-delay-rejoin'); reports=[json.loads(Path('installed-journey-'+m+'.json').read_text(encoding='utf-8')) for m in modes]; assert all(r['experimentalApproachMode']==m and r['classification']=='SYNTHETIC_ONLY' and not r['gameInputSent'] and not r['physicalQualification'] for m,r in zip(modes,reports)); assert all('syntheticCommandPrediction' in r['approach'] for r in reports[:2]); assert 'syntheticTerminalProgressRecovery' in reports[2]['approach']; print('INSTALLED_EXPERIMENTAL_JOURNEYS', [r['summary']['status'] for r in reports])"
      - name: Upload installed synthetic journey
        uses: actions/upload-artifact@v4
        with:
          name: installed-synthetic-journey
          path: ${{ runner.temp }}/installed-journey*.json
          if-no-files-found: error
          retention-days: 90
